registry:
  namespace: "osse-11"      # MDR namespace
  name: "ACLF"             #short registry name (used in output filenames)
  url: "https://register.neocyst.de/schemata/data_element_list.csv"  # url of the data element list (can alternatively be used as downloaded csv)
  mdr_base: "https://mdr.prod.osse-register.de/v3/api/mdr/"  # MDR api base URL, expects a "/" in the end
  dob_source_id: "X_225_0_55" # Source_ID for date of birth, to be used in Temporal Plausibility checks

paths:
  raw_export: "data/raw/ACLF_2026-02-12_MDAT.csv" # relative to project root

scripts:
